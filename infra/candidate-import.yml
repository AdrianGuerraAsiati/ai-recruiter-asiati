AWSTemplateFormatVersion: "2010-09-09"
Description: Candidate import staging bucket, SQS queue and DLQ for AI Recruiter.

Parameters:
  RuntimeRoleArn:
    Type: String
    Description: ARN of the existing AiRecruiterBedrockRuntimeRole used by API and worker.
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN that receives candidate-import alarms.
  EnableOperationalAlarms:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable CloudWatch alarms after deployment IAM has been verified.

Conditions:
  CreateOperationalAlarms:
    Fn::Equals:
      - Ref: EnableOperationalAlarms
      - "true"
  HasAlarmTopic:
    Fn::Not:
      - Fn::Equals:
          - Ref: AlarmTopicArn
          - ""

Resources:
  ImportStagingBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - POST
              - HEAD
            AllowedOrigins:
              - https://ai.adrianguerra.net
              - http://localhost:5173
              - http://localhost:5174
              - http://localhost:5175
            AllowedHeaders:
              - "*"
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireImportStagingAfterOneDay
            Status: Enabled
            Prefix: ""
            ExpirationInDays: 1

  ImportStagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: ImportStagingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RuntimeListImportStagingBucket
            Effect: Allow
            Principal:
              AWS:
                Ref: RuntimeRoleArn
            Action:
              - s3:ListBucket
            Resource:
              Fn::GetAtt:
                - ImportStagingBucket
                - Arn
          - Sid: RuntimeManageImportStagingObjects
            Effect: Allow
            Principal:
              AWS:
                Ref: RuntimeRoleArn
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource:
              Fn::Sub:
                - "${BucketArn}/*"
                - BucketArn:
                    Fn::GetAtt:
                      - ImportStagingBucket
                      - Arn

  ImportDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ImportQueue:
    Type: AWS::SQS::Queue
    Properties:
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 300
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - ImportDlq
            - Arn
        maxReceiveCount: 5

  ImportDlqVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateOperationalAlarms
    Properties:
      AlarmDescription: Candidate import messages reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - ImportDlq
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        Fn::If:
          - HasAlarmTopic
          - - Ref: AlarmTopicArn
          - Ref: AWS::NoValue

  ImportQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateOperationalAlarms
    Properties:
      AlarmDescription: Candidate import queue backlog is above the operational threshold.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - ImportQueue
              - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        Fn::If:
          - HasAlarmTopic
          - - Ref: AlarmTopicArn
          - Ref: AWS::NoValue

  ImportQueueOldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateOperationalAlarms
    Properties:
      AlarmDescription: Candidate import queue has work older than fifteen minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - ImportQueue
              - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 900
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        Fn::If:
          - HasAlarmTopic
          - - Ref: AlarmTopicArn
          - Ref: AWS::NoValue

  ImportQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: ImportQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RuntimeCandidateImportQueueAccess
            Effect: Allow
            Principal:
              AWS:
                Ref: RuntimeRoleArn
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
                - ImportQueue
                - Arn

Outputs:
  ImportStagingBucket:
    Description: Private S3 bucket for temporary candidate import uploads.
    Value:
      Ref: ImportStagingBucket
  ImportQueueUrl:
    Description: Candidate import SQS queue URL.
    Value:
      Ref: ImportQueue
  ImportQueueArn:
    Description: Candidate import SQS queue ARN.
    Value:
      Fn::GetAtt:
        - ImportQueue
        - Arn
  ImportDlqUrl:
    Description: Candidate import dead-letter queue URL.
    Value:
      Ref: ImportDlq
  ImportDlqAlarmName:
    Condition: CreateOperationalAlarms
    Description: CloudWatch alarm raised when the candidate import DLQ receives messages.
    Value:
      Ref: ImportDlqVisibleMessagesAlarm
  ImportQueueBacklogAlarmName:
    Condition: CreateOperationalAlarms
    Description: CloudWatch alarm for candidate import queue backlog.
    Value:
      Ref: ImportQueueBacklogAlarm
  ImportQueueOldestMessageAlarmName:
    Condition: CreateOperationalAlarms
    Description: CloudWatch alarm for candidate import queue age.
    Value:
      Ref: ImportQueueOldestMessageAlarm
