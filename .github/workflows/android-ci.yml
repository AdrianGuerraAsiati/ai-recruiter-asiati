name: android-ci

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        working-directory: android
        env:
          TALENT_ID_API_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://talent.asiati.com.co' }}
        run: |
          set -euo pipefail
          test -n "$TALENT_ID_API_BASE_URL"
          gradle :app:assembleDebug             -PTALENT_ID_API_BASE_URL="$TALENT_ID_API_BASE_URL"             --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talent-id-kiosk-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
