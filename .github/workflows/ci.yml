name: CI — Tests & Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # CHANGE DETECTION
  # Keeps Resume Agent validation out of unrelated PRs while
  # preserving the same checks whenever agent-related files or root Python dependencies change.
  # Manual dispatch intentionally runs the full suite.
  # ─────────────────────────────────────────────────────────
  changes:
    name: Detect Resume Agent changes
    runs-on: ubuntu-latest
    outputs:
      resume_agent: ${{ steps.filter.outputs.resume_agent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Resume Agent paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "resume_agent=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: running Resume Agent validation."
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

          if grep -Eq '^(requirements[.]txt$|tools/indeed_resume_agent/|app/domains/candidate_ingestion/indeed_agent_.*[.]py$|app/domains/candidate_ingestion/indeed_email_agent_service[.]py$|[.]github/workflows/ci[.]yml$|[.]github/workflows/indeed-resume-agent[.]yml$)' changed-files.txt; then
            echo "resume_agent=true" >> "$GITHUB_OUTPUT"
            echo "Resume Agent-related change detected."
          else
            echo "resume_agent=false" >> "$GITHUB_OUTPUT"
            echo "No Resume Agent-related changes detected; agent jobs will be skipped."
          fi

  # ─────────────────────────────────────────────────────────
  # BACKEND TESTS
  # ─────────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (pytest x2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist pytest-cov alembic psycopg2-binary ruff

      - name: Validate Python correctness
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/models.py
          python -m py_compile app/crud.py
          python -m py_compile app/deps.py
          ruff check app --select E9,F63,F7,F82

      - name: Validate production shell scripts
        run: |
          bash -n scripts/deploy-api.sh
          bash -n scripts/deploy-worker.sh
          bash -n scripts/deploy-frontend.sh
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
          bash -n scripts/run-frontend-e2e.sh
          bash -n scripts/manage-lightsail-ssh-firewall.sh

      - name: Run backend pytest in parallel (SQLite)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest app/tests/ -n 2 --dist=loadfile -v --tb=short \
            --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80

  frontend-e2e:
    name: Frontend E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install and build frontend
        working-directory: frontend-react
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install browser test dependencies
        run: |
          pip install "playwright>=1.50,<2" pytest
          python -m playwright install --with-deps chromium

      - name: Run browser journey and accessibility smoke
        run: bash scripts/run-frontend-e2e.sh

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-screenshots
          path: frontend-react/test-results/e2e/*.png
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # LINUX RESUME AGENT TESTS
  # Only runs when Resume Agent-related files changed.
  # ─────────────────────────────────────────────────────────
  resume-agent-linux:
    name: Resume Agent tests (Linux)
    needs: changes
    if: needs.changes.outputs.resume_agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Resume Agent deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tools/indeed_resume_agent/requirements.txt
          pip install pytest

      - name: Install Chromium for Resume Agent browser fixtures
        run: python -m playwright install --with-deps chromium

      - name: Run ASIATI Resume Agent tests
        run: |
          python -m pytest -q tools/indeed_resume_agent/tests

  # ─────────────────────────────────────────────────────────
  # WINDOWS RESUME AGENT PREFLIGHT
  # Mirrors the production agent's Python/OS and verifies the
  # real Chrome channel + Windows Credential Manager.
  # Only runs when Resume Agent-related files changed.
  # ─────────────────────────────────────────────────────────
  resume-agent-windows:
    name: Resume Agent (Windows + Chrome)
    needs: changes
    if: needs.changes.outputs.resume_agent == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create production-like agent environment
        shell: powershell
        run: |
          python -m venv .agent-venv
          .\.agent-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.agent-venv\Scripts\pip.exe install -r .\tools\indeed_resume_agent\requirements.txt
          .\.agent-venv\Scripts\pip.exe install pytest

      - name: Install Chromium for golden browser fixtures
        shell: powershell
        run: .\.agent-venv\Scripts\python.exe -m playwright install chromium

      - name: Run full Resume Agent suite on Windows
        shell: powershell
        run: .\.agent-venv\Scripts\python.exe -m pytest -q tools\indeed_resume_agent\tests

      - name: Build production Windows onedir
        shell: powershell
        run: .\tools\indeed_resume_agent\build.ps1

      - name: Execute packaged binary self-test
        shell: powershell
        run: |
          $Exe = ".\dist\ASIATI Resume Agent\ASIATI Resume Agent.exe"
          if (-not (Test-Path $Exe)) { throw "Packaged Resume Agent executable is missing" }
          $Process = Start-Process -FilePath $Exe -ArgumentList "--self-test" -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            throw "Packaged Resume Agent self-test failed with exit code $($Process.ExitCode)"
          }

      - name: Publish validated Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASIATI-Resume-Agent-Windows-Responsive
          path: dist/ASIATI Resume Agent/**
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # POSTGRESQL + ALEMBIC SMOKE TEST
  # Runs independently from SQLite to reduce wall-clock time.
  # ─────────────────────────────────────────────────────────
  backend-smoke:
    name: Backend smoke (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_recruiter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest alembic psycopg2-binary

      - name: Apply Alembic migrations and verify schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_recruiter_test
        run: |
          python -m pytest app/tests/test_postgres_migrations.py -v --tb=short

  # ─────────────────────────────────────────────────────────
  # FRONTEND LINT & BUILD
  # ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend deps
        working-directory: frontend-react
        run: npm ci

      - name: Lint
        working-directory: frontend-react
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend-react
        run: npm test

      - name: Build
        working-directory: frontend-react
        env:
          VITE_API_URL: /api
        run: npm run build


  odoo-finance-probe:
    name: Odoo finance probe (read-only)
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/odoo-finance-probe-20261006'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::890876258895:role/AiRecruiterGithubDeployRole
          aws-region: us-east-2

      - name: Open temporary SSH access
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_PUBLIC_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          chmod +x scripts/manage-lightsail-ssh-firewall.sh
          INSTANCE_NAME=ai-recruiter-micro-prod AWS_REGION=us-east-2             scripts/manage-lightsail-ssh-firewall.sh open "$RUNNER_PUBLIC_IP"

      - name: Query Odoo financial aggregates through Talent runtime
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_JSON=$(aws lightsail get-instance-access-details --instance-name ai-recruiter-micro-prod --protocol ssh --region us-east-2)
          KEY_FILE=/tmp/lightsail-key
          CERT_FILE="${KEY_FILE}-cert.pub"
          echo "$ACCESS_JSON" | jq -er '.accessDetails.privateKey' > "$KEY_FILE"
          echo "$ACCESS_JSON" | jq -er '.accessDetails.certKey' > "$CERT_FILE"
          chmod 600 "$KEY_FILE" "$CERT_FILE"
          SSH_USER=$(echo "$ACCESS_JSON" | jq -er '.accessDetails.username')
          INSTANCE_IP=$(echo "$ACCESS_JSON" | jq -er '.accessDetails.ipAddress')
          SSH=(-i "$KEY_FILE" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/lightsail-known-hosts)

          ssh "${SSH[@]}" "$SSH_USER@$INSTANCE_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo docker exec -i ai-recruiter-api python - > /tmp/asiati-odoo-finance.json <<'PY'
          import json
          from app.domains.odoo_sync.integration import build_odoo_client

          client = build_odoo_client()

          def rpc(model, method, args=None, kwargs=None):
              return client.execute_kw(model, method, args or [], kwargs or {})

          def summary(company_id, start_date, end_date):
              pnl_types = ["income", "income_other", "expense", "expense_direct_cost", "expense_depreciation"]
              domain = [
                  ["date", ">=", start_date],
                  ["date", "<=", end_date],
                  ["parent_state", "=", "posted"],
                  ["company_id", "=", company_id],
                  ["account_id.account_type", "in", pnl_types],
              ]
              groups = rpc(
                  "account.move.line",
                  "read_group",
                  [domain, ["balance:sum", "account_id"], ["account_id"]],
                  {"lazy": False},
              )
              account_ids = []
              for group in groups:
                  account = group.get("account_id")
                  if isinstance(account, (list, tuple)) and account:
                      account_ids.append(account[0])

              accounts = {}
              if account_ids:
                  rows = rpc(
                      "account.account",
                      "read",
                      [account_ids],
                      {"fields": ["name", "code", "account_type"]},
                  )
                  accounts = {row["id"]: row for row in rows}

              revenue = 0.0
              expenses = 0.0
              by_type = {}
              for group in groups:
                  account = group.get("account_id")
                  account_id = account[0] if isinstance(account, (list, tuple)) and account else None
                  account_type = (accounts.get(account_id) or {}).get("account_type")
                  balance = float(group.get("balance") or 0.0)
                  by_type[account_type] = by_type.get(account_type, 0.0) + balance
                  if account_type in ("income", "income_other"):
                      revenue += -balance
                  elif account_type in ("expense", "expense_direct_cost", "expense_depreciation"):
                      expenses += balance

              invoice_domain = [
                  ["invoice_date", ">=", start_date],
                  ["invoice_date", "<=", end_date],
                  ["state", "=", "posted"],
                  ["company_id", "=", company_id],
                  ["move_type", "in", ["out_invoice", "out_refund"]],
              ]
              invoice_groups = rpc(
                  "account.move",
                  "read_group",
                  [invoice_domain, ["amount_untaxed_signed:sum", "amount_total_signed:sum"], []],
                  {"lazy": False},
              )
              invoice = invoice_groups[0] if invoice_groups else {}

              return {
                  "start_date": start_date,
                  "end_date": end_date,
                  "accounting_revenue": round(revenue, 2),
                  "accounting_expenses": round(expenses, 2),
                  "accounting_net_profit": round(revenue - expenses, 2),
                  "posted_sales_untaxed_signed": round(float(invoice.get("amount_untaxed_signed") or 0.0), 2),
                  "posted_sales_total_signed": round(float(invoice.get("amount_total_signed") or 0.0), 2),
                  "by_account_type_balance": {
                      str(key): round(value, 2) for key, value in by_type.items()
                  },
              }

          result = {"health": client.healthcheck()}
          companies = client.search_read(
              "res.company",
              [],
              fields=["name", "currency_id"],
              limit=50,
          )
          result["visible_companies"] = companies
          result["asiati_results"] = []
          for company in companies:
              name = str(company.get("name") or "")
              cid = int(company["id"])
              try:
                  result["asiati_results"].append(
                      {
                          "company_id": cid,
                          "company_name": name,
                          "currency": company.get("currency_id"),
                          "FY2025": summary(cid, "2025-01-01", "2025-12-31"),
                          "YTD2026": summary(cid, "2026-01-01", "2026-10-06"),
                      }
                  )
              except Exception as exc:
                  result["asiati_results"].append(
                      {
                          "company_id": cid,
                          "company_name": name,
                          "error": type(exc).__name__,
                          "message": str(exc),
                      }
                  )

          print(json.dumps(result, ensure_ascii=False))
          PY

          AWS_CONFIG_FILE=/opt/ai-recruiter/aws/config             aws s3 cp /tmp/asiati-odoo-finance.json             s3://ai-recruiter-candidate-import-importstagingbucket-6ycz7qu9lgcp/admin/finance-probe/2026-10-06/asiati-summary.json             --profile ai-recruiter-bedrock             --sse AES256 >/dev/null

          rm -f /tmp/asiati-odoo-finance.json
          REMOTE

      - name: Close temporary SSH access
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/manage-lightsail-ssh-firewall.sh
          INSTANCE_NAME=ai-recruiter-micro-prod AWS_REGION=us-east-2             scripts/manage-lightsail-ssh-firewall.sh close
          rm -f /tmp/lightsail-key /tmp/lightsail-key-cert.pub /tmp/lightsail-known-hosts
