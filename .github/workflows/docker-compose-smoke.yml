name: Docker Compose — Local integration

on:
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "Dockerfile"
      - "requirements.txt"
      - "frontend-react/Dockerfile"
      - "frontend-react/nginx.conf"
      - "app/bootstrap.py"
      - "app/health.py"
      - "app/migrations/**"
      - ".github/workflows/docker-compose-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Start full local Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: ai-recruiter-ci
      WEB_PORT: "18080"
      COMPOSE_PROGRESS: plain
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Docker and Compose syntax
        run: |
          docker version
          docker compose version
          docker compose config --quiet

      - name: Build images and start stack
        run: |
          set -euo pipefail
          timeout 1200 docker compose up --build --detach

      - name: Verify migration, containers and HTTP requests via Nginx
        run: |
          set -euo pipefail

          migrate_id="$(docker compose ps --all --quiet migrate)"
          test -n "$migrate_id"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$migrate_id")" = "0"

          for service in db ai-recruiter-api web; do
            container_id="$(docker compose ps --quiet "$service")"
            test -n "$container_id"
            test "$(docker inspect -f '{{.State.Status}}' "$container_id")" = "running"
          done

          # HTTP through Nginx proves that its upstream service name resolves.
          curl --fail --show-error --silent --retry 15 --retry-all-errors --retry-delay 2 \
            --max-time 5 http://127.0.0.1:18080/api/live > /tmp/compose-live.json
          curl --fail --show-error --silent --retry 15 --retry-all-errors --retry-delay 2 \
            --max-time 5 http://127.0.0.1:18080/api/ready > /tmp/compose-ready.json
          python - <<'PY'
          import json

          with open("/tmp/compose-live.json", encoding="utf-8") as f:
              assert json.load(f) == {"status": "ok"}
          with open("/tmp/compose-ready.json", encoding="utf-8") as f:
              assert json.load(f) == {"status": "ok", "db": True}
          PY

          curl --fail --show-error --silent http://127.0.0.1:18080/login > /tmp/compose-login.html
          grep -q 'id="root"' /tmp/compose-login.html

          version="$(docker compose exec -T db psql -U ai_recruiter -d ai_recruiter -tAc 'SELECT version_num FROM alembic_version')"
          test -n "$version"
          echo "Alembic revision: $version"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail=120 db migrate ai-recruiter-api web || true

      - name: Remove all ephemeral CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
